version: "3.8"

# =============================================================================
# Sepiida — Server only (no agent, no Postgres)
#
# Before starting:
#   1. Copy query-keys.example -> query-keys.txt and set real keys
#   2. Copy .env.example -> .env and set DATABASE_URL to your Postgres instance
#   3. Set SEPIIDA_TASK_TOKEN_SECRET to the same long random secret used by Squid
#      (or explicitly enable and mount static agent keys for legacy/local writes).
#
# Usage:
#   docker compose -f docker-compose.server.yml build
#   docker compose -f docker-compose.server.yml up -d
# =============================================================================

services:
  # ── Sepiida Server ────────────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: docker.schema-bio.com/schemabio/sepiida-server:v0.2.0
    restart: unless-stopped
    command:
      - "-p=9090"
      - "-query-key=/etc/sepiida/keys/query-keys.txt"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEPIIDA_KEY_REFRESH_SECONDS: ${SEPIIDA_KEY_REFRESH_SECONDS:-30}
      SEPIIDA_AUTH_MODE: ${SEPIIDA_AUTH_MODE:-task-token}
      SEPIIDA_TASK_TOKEN_SECRET: ${SEPIIDA_TASK_TOKEN_SECRET:-}
    ports:
      - "${SERVER_PORT:-9090}:9090"
    volumes:
      - ${SEPIIDA_QUERY_KEY_FILE:-./query-keys.txt}:/etc/sepiida/keys/query-keys.txt:ro

networks:
  default:
    driver: bridge
