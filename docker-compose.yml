# =============================================================================
# Sepiida Server only
#
# Before starting:
#   1. Copy query-keys.example -> query-keys.txt and set real query keys
#   2. Copy .env.example -> .env and set DATABASE_URL to your Postgres instance
#   3. This standalone compose defaults to static authentication. For SaaS,
#      switch to task-token authentication and set SEPIIDA_TASK_TOKEN_SECRET.
#
# Usage:
#   docker compose build
#   docker compose up -d
# =============================================================================

services:
  server:
    build:
      context: .
    image: docker.schema-bio.com/schemabio/sepiida-server:v0.2.0
    restart: unless-stopped
    command: ["-p=9090", "-query-key=/etc/sepiida/keys/query-keys.txt"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEPIIDA_KEY_REFRESH_SECONDS: ${SEPIIDA_KEY_REFRESH_SECONDS:-30}
      SEPIIDA_AUTH_MODE: ${SEPIIDA_AUTH_MODE:-static}
      SEPIIDA_TASK_TOKEN_SECRET: ${SEPIIDA_TASK_TOKEN_SECRET:-}
    ports:
      - "${SERVER_PORT:-9090}:9090"
    volumes:
      - ${SEPIIDA_AGENT_KEY_FILE:-./agent-keys.txt}:/etc/sepiida/keys/agent-keys.txt:ro
      - ${SEPIIDA_QUERY_KEY_FILE:-./query-keys.txt}:/etc/sepiida/keys/query-keys.txt:ro
