name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). If empty, only builds artifacts without creating release.'
        required: false
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./...

      - name: Build Server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o bin/sepiida-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/server

      - name: Build Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -buildvcs=true -ldflags="-s -w" -o bin/sepiida-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/agent

      - name: Checksum Agent
        working-directory: bin
        run: sha256sum sepiida-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} > sepiida-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}.sha256

      - name: Upload Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepiida-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/sepiida-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

      - name: Upload Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepiida-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/sepiida-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
            bin/sepiida-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Only create release if:
    # - triggered by tag push, OR
    # - triggered manually with create_release=true AND version specified
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true && inputs.version != '')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Move all binaries to release directory
          find artifacts -type f -exec mv {} release/ \;
          # List files
          ls -la release/

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: use the tag as version
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Manual trigger: use input version
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Sepiida ${{ steps.get_version.outputs.VERSION }}

            ### Downloads

            | Platform | Server | Agent |
            |----------|--------|-------|
            | Linux AMD64 | sepiida-server-linux-amd64 | sepiida-agent-linux-amd64 |
            | Linux ARM64 | sepiida-server-linux-arm64 | sepiida-agent-linux-arm64 |
            | Windows AMD64 | sepiida-server-windows-amd64.exe | sepiida-agent-windows-amd64.exe |
            | macOS AMD64 | sepiida-server-darwin-amd64 | sepiida-agent-darwin-amd64 |
            | macOS ARM64 | sepiida-server-darwin-arm64 | sepiida-agent-darwin-arm64 |

            ### Usage

            **1. Prepare key files:**
            ```bash
            # Agent keys (for pushing data)
            echo "agent-key-001" > agent-keys.txt

            # Query keys (for querying results)
            echo "query-key-001" > query-keys.txt
            ```

            **Server:**
            ```bash
            ./sepiida-server-linux-amd64 -p 9090 -d "$DATABASE_URL" \
                -agent-key agent-keys.txt \
                -query-key query-keys.txt -auth-mode static
            ```

            **Agent:**
            ```bash
            sha256sum -c sepiida-agent-linux-amd64.sha256
            sudo install -m 0755 sepiida-agent-linux-amd64 /usr/local/bin/sepiida-agent
            sepiida-agent --version
            sepiida-agent -s http://server:9090 -key agent-key-001 -w /mnt/data/output
            ```

            **Query:**
            ```bash
            curl -H "Authorization: Bearer query-key-001" \
                "http://server:9090/api/v1/workflow?uuid=xxx"

            # Force reload keys (requires query key)
            curl -X POST -H "Authorization: Bearer query-key-001" \
                "http://server:9090/api/v1/keys/reload"
            ```
          files: release/*
          draft: false
          prerelease: false
