name: Build Sepiida Server image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish, for example 0.4.0 or latest
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-sepiida-server-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/schemabio/sepiida-server

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: ${IMAGE_TAG}" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=Sepiida Server
            org.opencontainers.image.description=MiniWDL status collection server
            org.opencontainers.image.vendor=SchemaBio

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write summary
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Sepiida Server image"
            echo
            echo "- Image: `${IMAGE_NAME}:${IMAGE_TAG}`"
            echo "- Digest: `${IMAGE_DIGEST}`"
            echo "- Platforms: `linux/amd64`, `linux/arm64`"
          } >> "${GITHUB_STEP_SUMMARY}"
